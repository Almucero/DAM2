        "400":
          description: "Bad request"
        "404":
          description: "Resource not found"
        "500":
          description: "Internal server error"
components:
  schemas:
    Character:
      type: object
      properties:
        id: { type: number, example: 1 }
        name: { type: string, example: "Goku" }
        ki: { type: string, example: "60.000.000" }
        maxKi: { type: string, example: "90 Septillion" }
        race: { type: string, example: Saiyan }
        gender: { type: string, example: Male }
        description: { type: string, example: "Description Goku..." }
        image: 
          type: string
          format: uri
          example: https://dragonball-api.com/characters/goku_normal.webp 
        affiliation: { type: string, example: "Z Fighter" }
        deletedAt: { type: boolean, nullable: true, example: null }
    Planet:
      type: object
      properties:
        id: { type: number, example: 1 }
        name: { type: string, example: "Planet Vegeta" }
        description: { type: string, example: "Description Planet Vegeta..." }
        image:
          type: string
          format: uri
          example: https://dragonball-api.com/planets/planet_vegeta.webp
    Transformation:
      type: object
      properties:
        id: { type: number, example: 1 }
        name: { type: string, example: "Goku SSJ" }
        image:
          type: string
          format: uri
          example: https://dragonball-api.com/transformations/goku_ssj.webp
        ki: { type: number, example: "3 Billion" }
        deletedAt: { type: boolean, nullable: true, example: null }
    PaginationMeta:
      type: object
      properties:
        totalItems: { type: number, example: x }
        itemCount: { type: number, example: 10 }
        itemsPerPage: { type: number, example: 10 }
        totalPages: { type: number, example: x }
        currentPage: { type: number, example: 1 }
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
          example: "https://dragonball-api.com/api/(characters/planets/transformations)?page=1&limit=10"
        previous:
          type: string
          nullable: true
          example: null
        next: 
          type: string
          nullable: true
          example: "https://dragonball-api.com/api/(characters/planets/transformations)?page=2&limit=10"
        last: 
          type: string
          nullable: true
          example: "https://dragonball-api.com/api/(characters/planets/transformations)?page=x&limit=10" 
    PaginatedCharacters:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Character" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
    PaginatedPlanets:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Planet" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
    PaginatedTransformations:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transformation" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
    CharacterDetailed:
      allOf:
        - $ref: "#/components/schemas/Character"
        - type: object
          properties:
            originPlanet: { $ref: "#/components/schemas/Planet" }
